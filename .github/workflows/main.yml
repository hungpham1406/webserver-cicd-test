name: CI/CD for Node.js Web Server

on:
  push:
    branches:
      - Coding

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20' # Adjust to your Node.js version
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  deploy:
    needs: test # Only runs if tests pass
    runs-on: self-hosted # Runs on your cm4stack
    steps:
      - name: Change to webserver directory
        run: cd /home/pi/webserver # Adjust to your project directory
      - name: Pull latest code
        run: git pull origin main
      - name: Install dependencies
        run: npm install
      - name: Restart web server
        run: sudo systemctl restart webserver